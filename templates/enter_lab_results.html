<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Lab Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            padding: 20px;
            margin-top: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: none;
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .result-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">🔬 Enter Lab Results</a>
            <div class="ms-auto">
                <a href="{{ url_for('lab_requests') }}" class="btn btn-light btn-sm">← Back to Requests</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Request: {{ request.request_no }} - {{ request.patient_name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% for i in range(test_ids|length) %}
                    <div class="result-form">
                        <h6>{{ test_names[i] }}</h6>
                        <input type="hidden" name="test_name_{{ test_ids[i] }}" value="{{ test_names[i] }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Result Value *</label>
                                <input type="text" name="result_{{ test_ids[i] }}" class="form-control" 
                                       value="{{ existing_results[test_ids[i]|string][4] if existing_results.get(test_ids[i]|string) else '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Interpretation</label>
                                <select name="interpretation_{{ test_ids[i] }}" class="form-select">
                                    <option value="">Select</option>
                                    <option value="Normal" {% if existing_results.get(test_ids[i]|string) and existing_results[test_ids[i]|string][6] == 'Normal' %}selected{% endif %}>Normal</option>
                                    <option value="Abnormal" {% if existing_results.get(test_ids[i]|string) and existing_results[test_ids[i]|string][6] == 'Abnormal' %}selected{% endif %}>Abnormal</option>
                                    <option value="Critical" {% if existing_results.get(test_ids[i]|string) and existing_results[test_ids[i]|string][6] == 'Critical' %}selected{% endif %}>Critical</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Remarks</label>
                            <textarea name="remarks_{{ test_ids[i] }}" class="form-control" rows="2">{{ existing_results.get(test_ids[i]|string, [])[7] if existing_results.get(test_ids[i]|string) else '' }}</textarea>
                        </div>
                    </div>
                    {% endfor %}
                    
                    <div class="alert alert-success mt-3">
                        ✅ Once you save these results, the request will be marked as <strong>Completed</strong>.
                    </div>
                    
                    <div class="text-end">
                        <a href="{{ url_for('view_lab_request', request_id=request.id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Results & Complete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
