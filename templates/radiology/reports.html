<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radiology Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: #1e3c72;"><div class="container"><a class="navbar-brand" href="{{ url_for('radiology_dashboard') }}">Radiology</a><div class="ms-auto"><a href="{{ url_for('radiology_logout') }}" class="btn btn-danger btn-sm">Logout</a></div></div></nav>
    <div class="container mt-4">
        <div class="card"><div class="card-header">Completed Reports</div>
            <div class="card-body"><div class="list-group">
                {% for report in reports %}
                <div class="list-group-item"><strong>{{ report.order_no }}</strong> - {{ report.patient_name }} ({{ report.imaging_type }})<br><small>Report Date: {{ report.report_date }}</small><p class="mt-2">{{ report.report[:200] }}...</p><a href="{{ url_for('radiology_order_detail', order_id=report.id) }}" class="btn btn-sm btn-outline-primary">View Full Report</a></div>
                {% endfor %}
            </div></div>
        </div>
    </div>
</body>
</html>
