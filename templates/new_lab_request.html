<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Lab Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            padding: 20px;
            margin-top: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
        }
        .total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .form-label {
            font-weight: 600;
        }
        .selected-test-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }
        .selected-test-item:hover {
            background: #e8eaf6;
        }
        .remove-test {
            cursor: pointer;
            color: #dc3545;
            font-weight: bold;
            font-size: 18px;
        }
        .remove-test:hover {
            color: #c82333;
        }
        .price-input {
            width: 120px;
            text-align: right;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">➕ New Lab Request</a>
            <div class="ms-auto">
                <a href="{{ url_for('lab_requests') }}" class="btn btn-light btn-sm">← Back to Requests</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Patient & Test Information</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="requestForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Patient Name *</label>
                            <input type="text" name="patient_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Patient ID</label>
                            <input type="text" name="patient_id" class="form-control" placeholder="Optional">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="patient_age" class="form-control" placeholder="Years">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Gender</label>
                            <select name="patient_gender" class="form-select">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Doctor's Name</label>
                            <input type="text" name="doctor_name" class="form-control" placeholder="Referring doctor">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select">
                                <option value="Normal">Normal</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2" placeholder="Any additional information..."></textarea>
                        </div>
                    </div>

                    <h6 class="mt-3 mb-3">Add Tests</h6>
                    <div class="row">
                        <div class="col-md-8">
                            <select id="testSelect" class="form-select">
                                <option value="">-- Select a test --</option>
                                {% for test in tests %}
                                <option value="{{ test.id }}" data-name="{{ test.test_name }}" data-price="{{ test.price }}">
                                    {{ test.test_name }} - ₦{{ "%.2f"|format(test.price) }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-primary w-100" onclick="addTest()">+ Add Test</button>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h6>Selected Tests</h6>
                        <div id="selectedTestsContainer" class="mt-2">
                            <div class="text-muted" id="noTestsMessage">No tests added yet. Please select tests above.</div>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-light rounded">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <strong>Subtotal:</strong>
                                <span id="subtotalAmount" class="ms-2">₦0.00</span>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label mb-0">Discount (₦)</label>
                                <input type="number" id="discountInput" class="form-control" value="0" step="100" onchange="updateTotal()">
                            </div>
                            <div class="col-md-3 text-end">
                                <h5>Grand Total:</h5>
                                <span class="total-amount" id="grandTotal">₦0.00</span>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12 text-end">
                                <a href="{{ url_for('lab_requests') }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Create Request</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let selectedTests = [];
        let nextId = 1;

        function addTest() {
            const select = document.getElementById('testSelect');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption.value) {
                alert('Please select a test');
                return;
            }
            
            const testId = selectedOption.value;
            const testName = selectedOption.getAttribute('data-name');
            const defaultPrice = parseFloat(selectedOption.getAttribute('data-price'));
            
            // Check if test already added
            if (selectedTests.some(t => t.id === testId)) {
                alert('This test has already been added');
                return;
            }
            
            // Add to selected tests
            selectedTests.push({
                uid: nextId++,
                id: testId,
                name: testName,
                price: defaultPrice
            });
            
            updateSelectedTestsDisplay();
            updateTotal();
            
            // Reset select
            select.value = '';
        }
        
        function removeTest(uid) {
            selectedTests = selectedTests.filter(t => t.uid !== uid);
            updateSelectedTestsDisplay();
            updateTotal();
        }
        
        function updatePrice(uid, newPrice) {
            const test = selectedTests.find(t => t.uid === uid);
            if (test) {
                test.price = parseFloat(newPrice);
                updateTotal();
            }
        }
        
        function updateSelectedTestsDisplay() {
            const container = document.getElementById('selectedTestsContainer');
            const noTestsMessage = document.getElementById('noTestsMessage');
            
            if (selectedTests.length === 0) {
                if (noTestsMessage) {
                    noTestsMessage.style.display = 'block';
                } else {
                    container.innerHTML = '<div class="text-muted" id="noTestsMessage">No tests added yet. Please select tests above.</div>';
                }
                return;
            }
            
            // Remove no tests message if exists
            if (noTestsMessage) {
                noTestsMessage.style.display = 'none';
            }
            
            // Build the HTML for selected tests
            let html = '';
            selectedTests.forEach(test => {
                html += `
                    <div class="selected-test-item" id="test-${test.uid}">
                        <div class="row align-items-center">
                            <div class="col-md-5">
                                <strong>${test.name}</strong>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label mb-0 small">Price (₦)</label>
                                <input type="number" 
                                       class="form-control form-control-sm price-input" 
                                       value="${test.price.toFixed(2)}" 
                                       step="100"
                                       onchange="updatePrice(${test.uid}, this.value)">
                            </div>
                            <div class="col-md-3">
                                <span class="fw-bold">₦${test.price.toFixed(2)}</span>
                            </div>
                            <div class="col-md-1 text-end">
                                <span class="remove-test" onclick="removeTest(${test.uid})" title="Remove">✕</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function updateTotal() {
            // Calculate subtotal
            const subtotal = selectedTests.reduce((sum, test) => sum + test.price, 0);
            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            const grandTotal = subtotal - discount;
            
            // Update displays
            document.getElementById('subtotalAmount').textContent = '₦' + subtotal.toFixed(2);
            document.getElementById('grandTotal').textContent = '₦' + grandTotal.toFixed(2);
        }
        
        // Prepare form before submit
        document.getElementById('requestForm').addEventListener('submit', function(e) {
            if (selectedTests.length === 0) {
                e.preventDefault();
                alert('Please add at least one test');
                return;
            }
            
            // Create hidden inputs for selected tests
            const form = this;
            
            // Remove existing test_ids inputs
            const existingInputs = form.querySelectorAll('input[name="test_ids"]');
            existingInputs.forEach(input => input.remove());
            
            // Add hidden inputs for each selected test
            selectedTests.forEach(test => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'test_ids';
                input.value = test.id;
                form.appendChild(input);
            });
            
            // Add custom prices as JSON
            const pricesInput = document.createElement('input');
            pricesInput.type = 'hidden';
            pricesInput.name = 'custom_prices';
            const pricesData = {};
            selectedTests.forEach(test => {
                pricesData[test.id] = test.price;
            });
            pricesInput.value = JSON.stringify(pricesData);
            form.appendChild(pricesInput);
            
            // Add discount
            const discountInput = document.createElement('input');
            discountInput.type = 'hidden';
            discountInput.name = 'discount_amount';
            discountInput.value = document.getElementById('discountInput').value;
            form.appendChild(discountInput);
        });
    </script>
</body>
</html>
