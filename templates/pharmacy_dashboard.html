<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pharmacy Dashboard • {{ hospital_name }}</title>

    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pharmacy_dashboard.css') }}">
</head>
<body>

    <!-- Fixed Top Bar -->
    <div class="topbar">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="user-info">
                <h2>Pharmacy Module</h2>
                <p>Welcome back, <strong>{{ pharmacist_name }}</strong></p>
                <p id="datetime" class="mb-0" style="font-size:0.9rem; color: var(--gray);"></p>
            </div>
            <a href="{{ url_for('pharmacy_logout') }}" class="logout-btn">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
            </a>
        </div>
    </div>

    <!-- Page Title -->
    <div class="page-title">
        <h1>Pharmacy Dashboard</h1>
        <span class="badge text-white">Active Session</span>
    </div>

    <!-- <a href="{{ url_for('pharmacy_logout') }}" class="logout-btn">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
    </a>
     -->

    <!-- Dashboard Cards -->
    <section class="dashboard-cards">

        <a href="{{ url_for('drug_sales') }}" class="text-decoration-none">
            <div class="card">
                <i class="bi bi-cart-check"></i>
                <h3>Drug Sales</h3>
                <p>Process patient prescriptions & sales</p>
            </div>
        </a>
        

        <a href="{{ url_for('add_stock') }}" class="text-decoration-none">
            <div class="card">
                <i class="bi bi-plus-circle"></i>
                <h3>Add Stock</h3>
                <p>Receive new drugs & update inventory</p>
            </div>
        </a>
        

        <a href="{{ url_for('stock_report') }}" class="text-decoration-none">
            <div class="card">
                <i class="bi bi-clipboard-data"></i>
                <h3>Stock Report</h3>
                <p>View current stock levels & expiry</p>
            </div>
        </a>

        <a href="#" class="text-decoration-none">
            <div class="card">
                <i class="bi bi-graph-up-arrow"></i>
                <h3>Daily Revenue</h3>
                <p>Track today's earnings & trends</p>
            </div>
        </a>

    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS for Date & Time -->
    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeString = now.toLocaleTimeString();
            const dateString = now.toLocaleDateString(undefined, options);
            document.getElementById('datetime').textContent = `${dateString} • ${timeString}`;
        }
        setInterval(updateDateTime, 1000); // update every second
        updateDateTime(); // initialize immediately
    </script>

</body>
</html>
