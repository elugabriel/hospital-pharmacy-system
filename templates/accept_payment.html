<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Payment | Billing & Revenue</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/accept_payment.css') }}">
</head>
<body>

<div class="billing-wrapper">

    <!-- Header -->
    <div class="page-header">
        <h2>Accept Payment</h2>
        <p>Verify invoice and collect payment</p>
    </div>

    <!-- Payment Form -->
    <form method="POST" action="{{ url_for('billing_confirm_payment') }}">

        <!-- Invoice Details -->
        <div class="card">
            <h3>Invoice Details</h3>

            <div class="details-grid">
                <div>
                    <label>Patient Name</label>
                    <input type="text" name="patient_name" id="patientName" required>
                </div>

                <div>
                    <label>Service Type</label>
                    <select name="service_type" id="serviceType" required>
                        <option value="">Select service type</option>
                        <option value="pharmacy">Pharmacy</option>
                        <option value="laboratory">Laboratory</option>
                        <option value="consultation">Consultation</option>
                        <option value="radiology">Radiology</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label>Receipt Date</label>
                    <input type="date" id="receiptDate" name="receipt_date" required>
                </div>
            </div>
        </div>

        <!-- Payment & Computation -->
        <div class="card">
            <h3>Payment & Financial Summary</h3>

            <div class="details-grid">

                <div>
                    <label>Payment Method</label>
                    <select name="payment_method" required>
                        <option value="">Select payment method</option>
                        <option value="Cash">Cash</option>
                        <option value="POS">POS</option>
                        <option value="Transfer">Bank Transfer</option>
                    </select>
                </div>

                <div>
                    <label>Amount Paid (₦)</label>
                    <input type="number" id="amountPaid" name="amount_paid" step="0.01" required>
                </div>

                <div>
                    <label>VAT (%)</label>
                    <input type="number" id="vat" name="vat" value="0" step="0.01">
                </div>

                <div>
                    <label>Discount (₦)</label>
                    <input type="number" id="discount" name="discount" value="0" step="0.01">
                </div>
            </div>

            <!-- Computation Display -->
            <div class="summary-box">
                <div><span>Subtotal:</span><span>₦<span id="subtotal">0.00</span></span></div>
                <div><span>VAT:</span><span>₦<span id="vatAmount">0.00</span></span></div>
                <div><span>Discount:</span><span>₦<span id="discountAmount">0.00</span></span></div>
                <div class="total">
                    <span>Grand Total:</span>
                    <span>₦<span id="grandTotal">0.00</span></span>
                </div>
            </div>

            <!-- Button Container -->
            <div class="button-group">
                <button type="submit" class="btn success">
                    Confirm Payment
                </button>
                <a href="{{ url_for('billing_dashboard') }}" class="btn cancel">
                    Cancel
                </a>
            </div>

        </div>

    </form>

</div>

<script>
    // Default date
    document.getElementById("receiptDate").valueAsDate = new Date();

    const amountPaid = document.getElementById("amountPaid");
    const vatInput = document.getElementById("vat");
    const discountInput = document.getElementById("discount");

    function calculateTotals() {
        let subtotal = parseFloat(amountPaid.value) || 0;
        let vatPercent = parseFloat(vatInput.value) || 0;
        let discount = parseFloat(discountInput.value) || 0;

        let vatAmount = (subtotal * vatPercent) / 100;
        let grandTotal = subtotal + vatAmount - discount;

        document.getElementById("subtotal").textContent = subtotal.toFixed(2);
        document.getElementById("vatAmount").textContent = vatAmount.toFixed(2);
        document.getElementById("discountAmount").textContent = discount.toFixed(2);
        document.getElementById("grandTotal").textContent = grandTotal.toFixed(2);
    }

    amountPaid.addEventListener("input", calculateTotals);
    vatInput.addEventListener("input", calculateTotals);
    discountInput.addEventListener("input", calculateTotals);
</script>

</body>
</html>
