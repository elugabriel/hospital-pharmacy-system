<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lab Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            padding: 20px;
            margin-top: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">🔬 Add New Lab Test</a>
            <div class="ms-auto">
                <a href="{{ url_for('lab_tests') }}" class="btn btn-light btn-sm">← Back to Tests</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Test Information</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Test Code *</label>
                            <input type="text" name="test_id" class="form-control" required placeholder="e.g., CBC-001">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Test Name *</label>
                            <input type="text" name="test_name" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select">
                                <option value="">Select Category</option>
                                <option value="Hematology">Hematology</option>
                                <option value="Biochemistry">Biochemistry</option>
                                <option value="Microbiology">Microbiology</option>
                                <option value="Immunology">Immunology</option>
                                <option value="Urinalysis">Urinalysis</option>
                                <option value="Radiology">Radiology</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price (₦) *</label>
                            <input type="number" name="price" class="form-control" required step="0.01">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Normal Range</label>
                            <input type="text" name="normal_range" class="form-control" placeholder="e.g., 4.5-11.0 x10^9/L">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Turnaround Time</label>
                            <input type="text" name="turnaround_time" class="form-control" placeholder="e.g., 2 hours, 24 hours">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preparation Instructions</label>
                        <textarea name="preparation_instructions" class="form-control" rows="3" placeholder="Fasting required? Any special preparation?"></textarea>
                    </div>
                    <div class="text-end">
                        <a href="{{ url_for('lab_tests') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Add Test</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
