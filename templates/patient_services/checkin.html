<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Check-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: none; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px 15px 0 0; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-check2-circle"></i> Patient Check-in</a>
            <div class="ms-auto">
                <a href="{{ url_for('patient_services_dashboard') }}" class="btn btn-light btn-sm me-2">Dashboard</a>
                <a href="{{ url_for('search_patients') }}" class="btn btn-light btn-sm me-2">Search Patient</a>
                <a href="{{ url_for('patient_services_logout') }}" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Patient Check-in Form</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Patient ID</label>
                        <input type="number" name="patient_id" class="form-control" required>
                        <small class="text-muted">Enter the patient ID to check in</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Service Type</label>
                        <select name="service_type" class="form-select" required>
                            <option value="Consultation">Consultation</option>
                            <option value="Follow-up">Follow-up</option>
                            <option value="Emergency">Emergency</option>
                            <option value="Admission">Admission</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_emergency" class="form-check-input" value="1" id="emergency">
                                <label class="form-check-label" for="emergency">Emergency Case</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="ward_requested" class="form-check-input" value="1" id="ward">
                                <label class="form-check-label" for="ward">Request Ward Admission</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3" id="wardTypeDiv" style="display:none">
                        <label class="form-label">Ward Type</label>
                        <select name="ward_type" class="form-select">
                            <option value="General">General Ward</option>
                            <option value="Private">Private Ward</option>
                            <option value="VIP">VIP Suite</option>
                            <option value="ICU">ICU</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="text-end">
                        <a href="{{ url_for('active_services') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Check In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('ward').addEventListener('change', function() {
            document.getElementById('wardTypeDiv').style.display = this.checked ? 'block' : 'none';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
